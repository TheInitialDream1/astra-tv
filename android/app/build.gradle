plugins { id 'com.android.application' }
android {
    namespace 'com.astra.tvhome'
    compileSdk 35
    defaultConfig { applicationId 'com.astra.tvhome'; minSdk 26; targetSdk 35; versionCode 9; versionName '0.4.0'; testInstrumentationRunner 'com.astra.tvhome.LauncherSmokeTest' }
    buildFeatures { buildConfig true }
    buildTypes { debug { debuggable true }; release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    androidResources { noCompress 'wasm', 'task' }
    defaultConfig { ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' } }
}
dependencies { implementation 'com.google.mediapipe:tasks-vision:0.10.32' }
